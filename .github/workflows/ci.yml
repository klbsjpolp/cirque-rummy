name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A frozen install never re-checks peers, so a Dependabot PR that bumps
      # vitest without @vitest/* installs cleanly and only fails later with a
      # confusing vitest error. Re-resolving with strict peers fails here instead.
      # --no-frozen-lockfile: CI implies a frozen lockfile, which --resolution-only
      # rejects; the install above has already proved the lockfile in sync.
      - name: Check peer dependencies
        run: pnpm install --resolution-only --no-frozen-lockfile --config.strict-peer-dependencies=true

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm run build
